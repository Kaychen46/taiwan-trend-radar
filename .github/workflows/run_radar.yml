name: Taiwan Trend Radar Pipeline

on:
  push:
    branches:
      - copilot/fix-failing-github-actions-job-run-pipeline
  schedule:
    - cron: '0 0,4,8,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Trend Radar
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python pipeline_mvp.py
      - name: Commit updated JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Trend Radar Bot"
          git add data/latest_trends.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update trends data"
          git push
