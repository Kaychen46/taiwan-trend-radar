    }

    const CATEGORIES = [
      { key: "ALL", label: "全部情報" },
      { key: "DARK_HORSE", label: "🐎 只看黑馬飆升" },
      { key: "消費生活", label: "消費生活" },
      { key: "商業科技", label: "商業科技" },
      { key: "社群文化", label: "社群文化" },
      { key: "財經投資", label: "財經投資" }
    ];

    let currentData = null;
    let currentPersona = "creator";
    let currentFilter = "ALL";
    let activePlaybooks = [];
    let isDemo = false;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function safeSourceUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" && !url.username && !url.password ? url.href : null;
      } catch {
        return null;
      }
    }

    async function loadTrends() {
      try {
        const res = await fetch("./data/latest_trends.json", { cache: "no-store" });
        if (!res.ok) throw new Error("No live JSON");
        const parsed = await res.json();
        if (!Array.isArray(parsed.trends) || !parsed.trends.length) throw new Error("Empty JSON");
        currentData = parsed;
      } catch (err) {
        currentData = FALLBACK_DATA;
        isDemo = true;
        document.getElementById("demo-banner").classList.add("show");
      }

      document.getElementById("meta-info").textContent =
        isDemo ? "示範資料｜未掃描真實訊號" :
        `更新：${currentData.updated_at}（台灣時間）｜掃描 ${currentData.total_signals_scanned} 則訊號`;

      if (!isDemo) {
        const notes = [];
        const updated = new Date(String(currentData.updated_at).replace(" ", "T") + "+08:00");
        if (!Number.isFinite(updated.getTime()) || Date.now() - updated.getTime() > 12 * 60 * 60 * 1000) {
          notes.push("資料已超過 12 小時未更新，請留意時效。 ");
        }
        const ptt = Object.values(currentData.ptt_status || {});
        if (ptt.length) {
          notes.push(`PTT 官方 Atom：${ptt.filter(value => value === "available").length}/${ptt.length} 個看板有近期文章；不含推文數。`);
        }
        if (notes.length) {
          const note = document.getElementById("data-note");
          note.textContent = notes.join(" ");
          note.classList.add("show");
        }
      }

      renderNav();
      renderView();
    }

    function getFilteredTrends() {
      const all = currentData?.trends || [];
      return all.filter(item => {
        if (currentFilter === "ALL") return true;
        if (currentFilter === "DARK_HORSE") return Boolean(item.is_dark_horse);
        return item.category === currentFilter;
      });
    }

    function countForCategory(key) {
      const all = currentData?.trends || [];
      if (key === "ALL") return all.length;
      if (key === "DARK_HORSE") return all.filter(t => t.is_dark_horse).length;
      return all.filter(t => t.category === key).length;
    }

    function renderNav() {
      const nav = document.getElementById("category-nav");
      nav.innerHTML = CATEGORIES.map(cat => `
        <button class="nav-btn ${currentFilter === cat.key ? "active" : ""}" data-cat="${cat.key}">
          <span>${cat.label}</span>
          <span class="nav-count">${countForCategory(cat.key)}</span>
        </button>
      `).join("");

      nav.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentFilter = btn.dataset.cat;
          renderNav();
          renderView();
        });
      });
    }

    function renderView() {
      const items = getFilteredTrends();
      const heroSlot = document.getElementById("hero-slot");
      const grid = document.getElementById("trend-grid");

      if (!items.length) {
        heroSlot.innerHTML = "";
        grid.innerHTML = `<p style="color:var(--muted);">此分類目前沒有符合門檻的爆點話題。</p>`;
        return;
      }

      const [hero, ...rest] = items;
      const heroIndex = currentData.trends.indexOf(hero);
      const personaTitle = currentPersona === "creator" ? "🎬 創作者可直接套用切角" : "🛒 電商／商業風向雷達";
      const heroPersonaText = currentPersona === "creator"
        ? (hero.creator_playbook?.[0] || "點擊查看完整切角")
        : (hero.ecommerce_radar || "點擊查看商業分析");

      heroSlot.innerHTML = `
        <article class="hero-card" onclick="openDrawer(${heroIndex})">
          <div class="hero-top">
            <span class="hero-badge-cat">🏆 本期焦點 · ${escapeHtml(hero.category)}</span>
            ${hero.is_dark_horse ? `<span class="hero-badge-dh">🐎 黑馬飆升</span>` : ``}
          </div>
          <h2>${escapeHtml(hero.topic_name)}</h2>
          <p class="hero-tldr">${escapeHtml(hero.tldr)}</p>
          <div class="hero-persona-box">
            <strong>${personaTitle}</strong>
            <span>${escapeHtml(heroPersonaText)}</span>
          </div>
          <div class="hero-footer">
            <span>🔥 熱度 ${escapeHtml(hero.heat_score)} ｜ ⚡ 黑馬 ${escapeHtml(hero.dark_horse_score)}</span>
            <span>閱讀 AI 完整拆解報告 →</span>
          </div>
        </article>
      `;

      grid.innerHTML = rest.map(item => {
        const idx = currentData.trends.indexOf(item);
        const personaText = currentPersona === "creator"
          ? (item.creator_playbook?.[0] || "點擊查看完整切角")
          : (item.ecommerce_radar || "點擊查看商業分析");

        return `
          <article class="card" onclick="openDrawer(${idx})">
            <div>
              <div class="card-top">
                <span class="badge-cat">${escapeHtml(item.category)}</span>
                ${item.is_dark_horse ? `<span class="badge-dh">🐎 黑馬</span>` : ``}
              </div>
              <h3>${escapeHtml(item.topic_name)}</h3>
              <p class="card-tldr">${escapeHtml(item.tldr)}</p>
              <div class="persona-box">
                <strong>${personaTitle}</strong>
                <span>${escapeHtml(personaText)}</span>
              </div>
            </div>
            <div class="card-footer">
              <div class="scores">
                <span class="score-heat">🔥 ${escapeHtml(item.heat_score)}</span>
                <span class="score-dh">⚡ ${escapeHtml(item.dark_horse_score)}</span>
              </div>
              <span class="cta-link">拆解報告 →</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function openDrawer(index) {
      const item = currentData.trends[index];
      if (!item) return;

      activePlaybooks = Array.isArray(item.creator_playbook) ? item.creator_playbook : [];

      document.getElementById("drawer-badges").innerHTML = `
        <span class="badge-cat">${escapeHtml(item.category)}</span>
        ${item.is_dark_horse ? `<span class="badge-dh">🐎 黑馬飆升</span>` : ""}
      `;
      document.getElementById("drawer-title").textContent = item.topic_name;

      const playbooksHtml = activePlaybooks.map((text, i) => `
        <div class="playbook-item">
          <span>${escapeHtml(text)}</span>
          <button class="copy-btn" onclick="copyPlaybook(this, ${i})">複製</button>
        </div>
      `).join("");

      const sourcesHtml = isDemo ? "示範內容沒有真實來源連結。" :
        (Array.isArray(item.reference_urls) ? item.reference_urls : []).map((url, i) => {
          const safeUrl = safeSourceUrl(url);
          if (!safeUrl) return "";
          return `<a class="source-link" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">↗ ${escapeHtml(item.sources_involved?.[i] || `原始來源 ${i + 1}`)}</a>`;
        }).join("") || "這則報告沒有可開啟的來源連結。";

      document.getElementById("drawer-content").innerHTML = `
        <div class="report-section">
          <h4>📌 30 秒事件脈絡 (TL;DR)</h4>
          <p>${escapeHtml(item.tldr)}</p>
        </div>
        <div class="report-section">
          <h4>🧬 AI 爆紅基因拆解</h4>
          <p><strong>情緒鉤子：</strong>${escapeHtml(item.viral_dna?.hook_type || "-")}</p>
          <p style="margin-top:0.5rem;"><strong>為何是現在：</strong>${escapeHtml(item.viral_dna?.why_now || "-")}</p>
        </div>
        <div class="report-section">
          <h4>🎬 創作者／行銷人可複製切角</h4>
          ${playbooksHtml}
        </div>
        <div class="report-section">
          <h4>🛒 電商選品與商業風向</h4>
          <p>${escapeHtml(item.ecommerce_radar || "-")}</p>
        </div>
        <div class="report-section">
          <h4>🔗 跨平台訊號來源（合規導流）</h4>
          <div class="source-list">${sourcesHtml}</div>
        </div>
      `;

      document.getElementById("drawer-backdrop").classList.add("open");
      document.getElementById("report-drawer").classList.add("open");
    }

    function closeDrawer() {
      document.getElementById("drawer-backdrop").classList.remove("open");
      document.getElementById("report-drawer").classList.remove("open");
    }

    function copyPlaybook(btn, idx) {
      const text = activePlaybooks[idx] || "";
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.textContent;
        btn.textContent = "已複製 ✓";
        setTimeout(() => btn.textContent = original, 1500);
      });
    }

    document.querySelectorAll(".persona-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".persona-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentPersona = btn.dataset.persona;
        renderView();
      });
    });

    document.getElementById("close-drawer").addEventListener("click", closeDrawer);
    document.getElementById("drawer-backdrop").addEventListener("click", closeDrawer);
    loadTrends();
  </script>
